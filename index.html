
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1.25rem 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.875rem 1rem}
.stat-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.main{display:grid;grid-template-columns:1fr 220px;gap:14px;margin-bottom:1.5rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.04em}
.add-row{display:flex;gap:8px;margin-bottom:1rem}
.add-row input{flex:1;font-size:14px}
.add-row select{font-size:13px;width:110px}
.add-row button{font-size:13px;padding:0 14px}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.task-item.done{opacity:.55}
.task-cb{width:15px;height:15px;cursor:pointer;accent-color:#378ADD;flex-shrink:0}
.task-name{flex:1;font-size:14px;color:var(--color-text-primary)}
.task-name.done-text{text-decoration:line-through;color:var(--color-text-tertiary)}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.b-todo{background:#E6F1FB;color:#185FA5}
.b-prog{background:#FAEEDA;color:#854F0B}
.b-done{background:#EAF3DE;color:#3B6D11}
.task-del{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:16px;padding:0 2px;line-height:1}
.task-del:hover{color:#E24B4A}
.proj-list{display:flex;flex-direction:column;gap:14px}
.proj-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;display:flex;justify-content:space-between}
.proj-pct{font-size:12px;color:var(--color-text-secondary)}
.bar-bg{background:var(--color-background-secondary);border-radius:4px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.chart-wrap{position:relative;width:100%;height:180px}
</style>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="main">
    <div class="card">
      <div class="card-title">Tugas</div>
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="Nama tugas baru..." />
        <select id="taskProj">
          <option value="Website Baru">Website Baru</option>
          <option value="Aplikasi Mobile">Aplikasi Mobile</option>
          <option value="Riset Pasar">Riset Pasar</option>
        </select>
        <button onclick="addTask()"><i class="ti ti-plus" aria-hidden="true"></i> Tambah</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-title">Progres Proyek</div>
        <div class="proj-list" id="projList"></div>
      </div>
      <div class="card">
        <div class="card-title">Status</div>
        <div class="chart-wrap"><canvas id="donut" role="img" aria-label="Distribusi status tugas dalam bentuk grafik donat">Distribusi status tugas.</canvas></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let tasks = [
  {id:1,name:"Desain halaman utama",proj:"Website Baru",status:"selesai"},
  {id:2,name:"Buat komponen navbar",proj:"Website Baru",status:"berjalan"},
  {id:3,name:"Setup database",proj:"Aplikasi Mobile",status:"selesai"},
  {id:4,name:"Integrasi API login",proj:"Aplikasi Mobile",status:"berjalan"},
  {id:5,name:"Survei pengguna",proj:"Riset Pasar",status:"tertunda"},
  {id:6,name:"Analisis kompetitor",proj:"Riset Pasar",status:"selesai"},
  {id:7,name:"Wireframe halaman produk",proj:"Website Baru",status:"tertunda"},
];
let nextId = 8;
let donutChart = null;

function getStats(){
  return {
    total: tasks.length,
    selesai: tasks.filter(t=>t.status==="selesai").length,
    berjalan: tasks.filter(t=>t.status==="berjalan").length,
    tertunda: tasks.filter(t=>t.status==="tertunda").length,
  };
}

function renderStats(){
  const s = getStats();
  const items = [
    {label:"Total tugas",val:s.total,color:"var(--color-text-primary)"},
    {label:"Selesai",val:s.selesai,color:"#3B6D11"},
    {label:"Berjalan",val:s.berjalan,color:"#854F0B"},
    {label:"Tertunda",val:s.tertunda,color:"#185FA5"},
  ];
  document.getElementById("stats").innerHTML = items.map(i=>
    `<div class="stat"><div class="stat-label">${i.label}</div><div class="stat-val" style="color:${i.color}">${i.val}</div></div>`
  ).join("");
}

function badgeClass(s){return s==="selesai"?"b-done":s==="berjalan"?"b-prog":"b-todo"}
function badgeLabel(s){return s==="selesai"?"Selesai":s==="berjalan"?"Berjalan":"Tertunda"}

function renderTasks(){
  document.getElementById("taskList").innerHTML = tasks.map(t=>
    `<div class="task-item${t.status==="selesai"?" done":""}">
      <input type="checkbox" class="task-cb" ${t.status==="selesai"?"checked":""} onchange="toggleTask(${t.id})">
      <span class="task-name${t.status==="selesai"?" done-text":""}">${t.name}</span>
      <span class="badge ${badgeClass(t.status)}">${badgeLabel(t.status)}</span>
      <button class="task-del" onclick="delTask(${t.id})" aria-label="Hapus tugas"><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>`
  ).join("");
}

function renderProjects(){
  const projs = [...new Set(tasks.map(t=>t.proj))];
  document.getElementById("projList").innerHTML = projs.map(p=>{
    const pt = tasks.filter(t=>t.proj===p);
    const done = pt.filter(t=>t.status==="selesai").length;
    const pct = pt.length ? Math.round(done/pt.length*100) : 0;
    const color = pct===100?"#639922":pct>=50?"#BA7517":"#378ADD";
    return `<div>
      <div class="proj-name"><span>${p}</span><span class="proj-pct">${pct}%</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join("");
}

function renderChart(){
  const s = getStats();
  const ctx = document.getElementById("donut").getContext("2d");
  if(donutChart) donutChart.destroy();
  donutChart = new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["Selesai","Berjalan","Tertunda"],
      datasets:[{data:[s.selesai,s.berjalan,s.tertunda],backgroundColor:["#639922","#BA7517","#378ADD"],borderWidth:0,hoverOffset:4}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw}`}}
      },
      cutout:"65%"
    }
  });
}

function render(){renderStats();renderTasks();renderProjects();renderChart();}

function toggleTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = t.status==="selesai"?"tertunda":"selesai";
  render();
}

function delTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  render();
}

function addTask(){
  const inp = document.getElementById("taskInput");
  const proj = document.getElementById("taskProj").value;
  const name = inp.value.trim();
  if(!name) return;
  tasks.push({id:nextId++,name,proj,status:"tertunda"});
  inp.value = "";
  render();
}

document.getElementById("taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});
render();
</script>
